<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Life Lacing Cards</title>
    <style>
        :root {
            --farm-green: #22c55e;
            --sky-blue: #bae6fd;
            --barn-red: #dc2626;
            --egg-gold: #facc15;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background-color: #fefce8;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #854d0e; margin: 10px 0; text-shadow: 1px 1px 0 white; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .btn {
            padding: 12px 20px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn-nav { background: white; border: 2px solid #854d0e; color: #854d0e; }
        .btn-nav.active { background: #fef08a; transform: translateY(2px); box-shadow: none; }
        .btn-action { color: white; }
        .btn-clear { background: #ef4444; }
        .btn-save { background: #3b82f6; }

        #canvas-container {
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 10px solid #fbbf24;
            touch-action: none;
            overflow: hidden;
        }

        canvas { cursor: crosshair; display: block; }
    </style>
</head>
<body>

    <h1>🚜 Farm Fun Lacing Cards</h1>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-nav" id="btn-barn" onclick="loadFarm('barn')">🏠 Barn</button>
            <button class="btn btn-nav" id="btn-tractor" onclick="loadFarm('tractor')">🚜 Tractor</button>
            <button class="btn btn-nav" id="btn-egg" onclick="loadFarm('egg')">🥚 Golden Egg</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-action btn-clear" onclick="resetLacing()">Start Over</button>
            <button class="btn btn-action btn-save" onclick="saveArt()">Save My Card</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="farmCanvas" width="600" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('farmCanvas');
        const ctx = canvas.getContext('2d');
        
        let holes = [];
        let lacedPath = [];
        let isDragging = false;
        let lastHole = null;
        let activeFarm = '';

        const farmData = {
            barn: {
                draw: () => {
                    ctx.fillStyle = '#bae6fd'; ctx.fillRect(0,0,600,500);
                    ctx.fillStyle = '#4ade80'; ctx.fillRect(0,350,600,150);
                    // Main Structure
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(150, 200, 300, 180);
                    // Roof
                    ctx.fillStyle = '#991b1b'; ctx.beginPath();
                    ctx.moveTo(130, 200); ctx.lineTo(300, 80); ctx.lineTo(470, 200); ctx.fill();
                    // Detail Trim
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 4;
                    ctx.strokeRect(170, 220, 260, 140);
                    ctx.beginPath(); ctx.moveTo(170, 220); ctx.lineTo(430, 360); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(430, 220); ctx.lineTo(170, 360); ctx.stroke();
                },
                holes: [
                    {x: 300, y: 80}, {x: 470, y: 200}, {x: 450, y: 380}, {x: 300, y: 380},
                    {x: 150, y: 380}, {x: 130, y: 200}
                ]
            },
            tractor: {
                draw: () => {
                    ctx.fillStyle = '#fef9c3'; ctx.fillRect(0,0,600,500);
                    // Tractor Body
                    ctx.fillStyle = '#16a34a'; ctx.fillRect(180, 220, 240, 80);
                    ctx.fillRect(320, 140, 100, 80);
                    // Big Wheel
                    ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(230, 320, 70, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(230, 320, 25, 0, Math.PI*2); ctx.fill();
                    // Small Wheel
                    ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(420, 340, 45, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(420, 340, 15, 0, Math.PI*2); ctx.fill();
                },
                holes: [
                    {x: 320, y: 140}, {x: 420, y: 140}, {x: 420, y: 340}, {x: 470, y: 340},
                    {x: 420, y: 390}, {x: 370, y: 340}, {x: 230, y: 250}, {x: 160, y: 320},
                    {x: 230, y: 395}, {x: 300, y: 320}
                ]
            },
            egg: {
                draw: () => {
                    ctx.fillStyle = '#fff7ed'; ctx.fillRect(0,0,600,500);
                    // Nest
                    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 15;
                    ctx.beginPath(); ctx.ellipse(300, 400, 200, 40, 0, 0, Math.PI*2); ctx.stroke();
                    // The Egg
                    const grad = ctx.createRadialGradient(250, 200, 20, 300, 250, 200);
                    grad.addColorStop(0, '#fef08a');
                    grad.addColorStop(1, '#facc15');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(300, 250, 140, 190, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#a16207'; ctx.lineWidth = 4; ctx.stroke();
                },
                holes: [
                    {x: 300, y: 60},  {x: 380, y: 100}, {x: 430, y: 200}, 
                    {x: 440, y: 300}, {x: 380, y: 400}, {x: 300, y: 440}, 
                    {x: 220, y: 400}, {x: 160, y: 300}, {x: 170, y: 200}, {x: 220, y: 100}
                ]
            }
        };

        function loadFarm(item) {
            activeFarm = item;
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + (item === 'egg' ? 'egg' : item)).classList.add('active');
            holes = farmData[item].holes;
            lacedPath = [];
            lastHole = null;
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            farmData[activeFarm].draw();

            // Lacing String (Thick Purple Rope)
            if (lacedPath.length > 1) {
                ctx.setLineDash([]);
                ctx.strokeStyle = '#7e22ce'; 
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(lacedPath[0].x, lacedPath[0].y);
                for (let i = 1; i < lacedPath.length; i++) ctx.lineTo(lacedPath[i].x, lacedPath[i].y);
                ctx.stroke();
                
                // Add a "thread" detail
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Holes
            holes.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill(); 
                
                ctx.beginPath();
                ctx.arc(h.x, h.y, 13, 0, Math.PI * 2);
                ctx.fillStyle = 'white'; ctx.fill();
                
                ctx.beginPath();
                ctx.arc(h.x, h.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#1a1a1a'; ctx.fill();
            });
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        }

        function interact(e) {
            const p = getPos(e);
            holes.forEach(h => {
                const d = Math.sqrt((p.x - h.x)**2 + (p.y - h.y)**2);
                if (d < 22 && lastHole !== h) {
                    lacedPath.push(h);
                    lastHole = h;
                    render();
                }
            });
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; interact(e); });
        window.addEventListener('mouseup', () => { isDragging = false; lastHole = null; });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) interact(e); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging = true; interact(e); }, {passive:false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(isDragging) interact(e); }, {passive:false});

        function resetLacing() { lacedPath = []; lastHole = null; render(); }
        function saveArt() {
            const link = document.createElement('a');
            link.download = 'farm-card.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        loadFarm('barn');
    </script>
</body>
</html>
